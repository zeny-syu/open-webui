name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 步驟 1: 下載你的主倉庫，同時也下載所有子模組 (submodules) 和 LFS 檔案
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      # 步驟 2: 使用官方 Action 推送到 Hugging Face Hub
      # 這個 Action 會自動處理認證、LFS 和所有 Git 細節，並且能正確處理子模組
      - name: Push to Hugging Face Hub
        uses: nateraw/huggingface-sync-action@v0.0.5
        with:
          github_repo_id: zeny-syu/open-webui
          huggingface_repo_id: ZenCook/open-webui
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          private: false
          space_sdk: docker
          #subdirectory: ''
